name: Lint & Format

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 flake8-bugbear black isort pylint

    - name: Run flake8
      run: flake8 backend/ --count --max-line-length=100 --extend-ignore=E203,W503 --show-source --statistics

    - name: Run black check
      run: black --check --line-length=100 backend/

    - name: Run isort check
      run: isort --check-only --profile=black backend/

    - name: Run pylint (warnings only)
      run: pylint backend/ --disable=all --enable=E,F --exit-zero || true

  javascript-lint:
    name: JavaScript Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run ESLint
      working-directory: frontend
      run: npm run lint

    - name: Check formatting
      working-directory: frontend
      run: npm run format:check || npm run format:check:prettier

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Lint Dockerfiles
      uses: hadolint/hadolint-action@v3.1.0
      with:
        ignore: DL3008,DL3009,DL4006
        dockerfile: Dockerfile.backend

    - name: Lint frontend Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        ignore: DL3008,DL3009,DL4006
        dockerfile: Dockerfile.frontend

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Lint YAML
      uses: ibiqlik/action-yamllint@v3
      with:
        file_or_dir: .github/workflows
        config_file: .yamllint

  lint-results:
    name: Lint Results Summary
    needs: [python-lint, javascript-lint, dockerfile-lint, yaml-lint]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check lint status
      run: |
        if [[ "${{ needs.python-lint.result }}" == "failure" ]] || \
           [[ "${{ needs.javascript-lint.result }}" == "failure" ]] || \
           [[ "${{ needs.dockerfile-lint.result }}" == "failure" ]] || \
           [[ "${{ needs.yaml-lint.result }}" == "failure" ]]; then
          echo "❌ Linting failed"
          exit 1
        fi
        echo "✅ All lint checks passed"
