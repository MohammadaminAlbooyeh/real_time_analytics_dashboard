name: Secret Rotation

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (preview without applying)
        required: true
        default: 'true'
        type: boolean
      backup:
        description: Backup existing env before rotation
        required: true
        default: 'true'
        type: boolean

env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
  DO_BACKUP: ${{ github.event.inputs.backup || 'true' }}

jobs:
  rotate-secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install crypto dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Verify rotate script exists
        run: |
          if [ -f scripts/rotate_secrets.sh ]; then
            echo "Rotate script found"
            chmod +x scripts/rotate_secrets.sh
          else
            echo "Error: rotate_secrets.sh not found"
            exit 1
          fi

      - name: Run secret rotation (dry-run)
        if: env.DRY_RUN == 'true'
        run: |
          echo "Running in dry-run mode - no changes applied"
          cp .env.example .env
          ./scripts/rotate_secrets.sh --env-file .env --dry-run

      - name: Run secret rotation (production)
        if: env.DRY_RUN == 'false'
        run: |
          echo "WARNING: This will rotate secrets in production!"
          ARGS=""
          if [ "$DO_BACKUP" = "true" ]; then
            ARGS="$ARGS --backup"
          fi
          ./scripts/rotate_secrets.sh $ARGS
        env:
          # Ensure the script has access to necessary tools
          PATH: /usr/local/bin:/usr/bin:/bin

      - name: Verify rotation
        if: env.DRY_RUN == 'false'
        run: |
          echo "Verifying secrets were rotated..."
          if [ -f .env ]; then
            echo "Environment file updated at: $(date -u)"
            echo "Checking SECRET_KEY exists..."
            grep -q "^SECRET_KEY=" .env && echo "SECRET_KEY found"
          fi

      - name: Upload backup
        if: env.DRY_RUN == 'false' && env.DO_BACKUP == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: env-backup
          path: .env.backup-*
          retention-days: 7
        continue-on-error: true

      - name: Post-rotation summary
        run: |
          echo "=== Secret Rotation Summary ==="
          echo "Mode: ${{ env.DRY_RUN == 'true' && 'Dry Run' || 'Live' }}"
          echo "Backup: ${{ env.DO_BACKUP == 'true' && 'Yes' || 'No' }}"
          echo "Completed at: $(date -u)"
          echo ""
          echo "Post-rotation steps:"
          echo "1. Restart all services: kubectl rollout restart -n analytics deployment/backend"
          echo "2. Verify database connectivity"
          echo "3. Check application logs for auth errors"
          echo "4. Update downstream services that reference old secrets"
