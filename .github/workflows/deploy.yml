name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      deploy-env: ${{ steps.determine-env.outputs.environment }}
      image-tag: ${{ steps.determine-env.outputs.tag }}

    steps:
    - uses: actions/checkout@v4

    - name: Determine environment and tag
      id: determine-env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
          ENV="production"
          TAG="${{ github.ref_name }}"
        else
          ENV="staging"
          TAG="latest"
        fi

        echo "environment=$ENV" >> $GITHUB_OUTPUT
        echo "tag=${TAG:-latest}" >> $GITHUB_OUTPUT
        echo "✅ Deployment target: $ENV (tag: ${TAG:-latest})"

    - name: Verify Docker images exist
      run: |
        echo "Checking Docker image availability..."
        echo "Backend image: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ steps.determine-env.outputs.tag }}"
        echo "Frontend image: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ steps.determine-env.outputs.tag }}"

  deploy-staging:
    name: Deploy to Staging
    needs: validate
    if: needs.validate.outputs.deploy-env == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-analytics.example.com

    steps:
    - uses: actions/checkout@v4

    - name: Deploy backend to staging
      run: |
        echo "🚀 Deploying backend to staging..."
        echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ needs.validate.outputs.image-tag }}"
        # Add your staging deployment commands here
        # Example: kubectl set image deployment/backend-staging backend=$IMAGE

    - name: Deploy frontend to staging
      run: |
        echo "🚀 Deploying frontend to staging..."
        echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ needs.validate.outputs.image-tag }}"
        # Add your staging deployment commands here

    - name: Run health checks
      run: |
        echo "🏥 Running health checks..."
        sleep 30
        # Add health check commands here
        echo "✅ Staging deployment healthy"

    - name: Notify deployment
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ Staging deployment successful: ${{ needs.validate.outputs.image-tag }}"
        else
          echo "❌ Staging deployment failed"
          exit 1
        fi

  deploy-production:
    name: Deploy to Production
    needs: validate
    if: needs.validate.outputs.deploy-env == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://analytics.example.com

    steps:
    - uses: actions/checkout@v4

    - name: Pre-deployment validation
      run: |
        echo "🔍 Pre-deployment validation..."
        echo "Deployment version: ${{ needs.validate.outputs.image-tag }}"
        echo "⚠️  Reminder: Manual approval required for production deployments"

    - name: Deploy backend to production
      run: |
        echo "🚀 Deploying backend to production..."
        echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ needs.validate.outputs.image-tag }}"
        # Add your production deployment commands here
        # Example: kubectl set image deployment/backend-prod backend=$IMAGE

    - name: Deploy frontend to production
      run: |
        echo "🚀 Deploying frontend to production..."
        echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ needs.validate.outputs.image-tag }}"
        # Add your production deployment commands here

    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests..."
        sleep 60
        # Add smoke test commands here
        echo "✅ Smoke tests passed"

    - name: Notify deployment
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ Production deployment successful: ${{ needs.validate.outputs.image-tag }}"
        else
          echo "❌ Production deployment failed - rollback procedures may be needed"
          exit 1
        fi

  deployment-summary:
    name: Deployment Summary
    needs: [validate, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Summary
      run: |
        echo "=== Deployment Summary ==="
        echo "Environment: ${{ needs.validate.outputs.deploy-env }}"
        echo "Image tag: ${{ needs.validate.outputs.image-tag }}"
        echo "Staging status: ${{ needs.deploy-staging.result }}"
        echo "Production status: ${{ needs.deploy-production.result }}"
