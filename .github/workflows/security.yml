name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit bandit[toml]

    - name: Safety check (known vulnerabilities)
      run: safety check --json --output json-report.json
      continue-on-error: true

    - name: pip-audit scan
      run: pip-audit -r requirements.txt --desc --output json
      continue-on-error: true

    - name: Bandit security scan
      run: bandit -r backend/ -f json -o bandit-results.json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: python-security-reports
        path: |
          json-report.json
          bandit-results.json
        retention-days: 30

  javascript-security:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: npm audit
      working-directory: frontend
      run: npm audit --production --audit-level=moderate --json > npm-audit.json || true

    - name: Check for high severity issues
      working-directory: frontend
      run: |
        if grep -q '"severity":"high"' npm-audit.json || grep -q '"severity":"critical"' npm-audit.json; then
          echo "⚠️ High/Critical vulnerabilities found in npm packages"
          npm audit --production || true
        fi

    - name: Upload npm audit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: javascript-security-reports
        path: frontend/npm-audit.json
        retention-days: 30

  container-security:
    name: Container Image Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker build -f Dockerfile.backend -t analytics-backend:scan .
        docker build -f Dockerfile.frontend -t analytics-frontend:scan .

    - name: Run Trivy on backend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'analytics-backend:scan'
        format: 'sarif'
        output: 'trivy-backend.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy on frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'analytics-frontend:scan'
        format: 'sarif'
        output: 'trivy-frontend.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-backend.sarif

    - name: Upload frontend Trivy results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-frontend.sarif

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python,javascript
        queries: security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{ matrix.language }}

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Gitleaks secret scan
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: true

    - name: TruffleHog scan
      run: |
        docker run --rm -v "$(pwd):/workdir" \
          trufflesecurity/trufflehog:latest \
          filesystem /workdir \
          --json 2>/dev/null | head -50 || echo "No high-confidence secrets detected"
      continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        fail-on-license-check: false

  security-summary:
    name: Security Scan Summary
    needs: [python-security, javascript-security, container-security, sast-scan, secret-detection]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check security scan results
      run: |
        echo "=== Security Scan Summary ==="
        echo "Python Security: ${{ needs.python-security.result }}"
        echo "JavaScript Security: ${{ needs.javascript-security.result }}"
        echo "Container Security: ${{ needs.container-security.result }}"
        echo "SAST Scan: ${{ needs.sast-scan.result }}"
        echo "Secret Detection: ${{ needs.secret-detection.result }}"
        echo ""
        if [[ "${{ needs.container-security.result }}" == "failure" ]] || [[ "${{ needs.sast-scan.result }}" == "failure" ]]; then
          echo "⚠️ Security issues detected - review GitHub Security tab"
        fi
