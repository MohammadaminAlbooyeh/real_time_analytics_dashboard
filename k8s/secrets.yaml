apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: analytics
  labels:
    app: analytics
type: Opaque
stringData:
  # Rotate these values regularly using scripts/rotate_secrets.sh
  SECRET_KEY: ""
  JWT_SECRET_KEY: ""
  DATABASE_URL: "postgresql+asyncpg://analytics_user:CHANGE_ME@postgres:5432/analytics"
  REDIS_URL: "redis://default:CHANGE_ME@redis:6379/0"
  ENCRYPTION_KEY: ""
  SENDGRID_API_KEY: ""
  SLACK_BOT_TOKEN: ""
  SAML_IDP_METADATA_URL: ""
  SAML_SP_ENTITY_ID: ""
  SAML_SP_ACS_URL: ""
  SAML_SP_PRIVATE_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: analytics
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "analytics_user"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "analytics"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: analytics
  labels:
    app: redis
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secrets
  namespace: analytics
  labels:
    app: nginx
type: kubernetes.io/tls
stringData:
  tls.crt: ""
  tls.key: ""
