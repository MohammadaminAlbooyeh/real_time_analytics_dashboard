apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: analytics
  labels:
    app: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
      multi_accept on;
      use epoll;
    }

    http {
      # Security
      server_tokens off;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
      ssl_prefer_server_ciphers off;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;
      ssl_session_tickets off;

      # Rate limiting zones
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
      limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/m;
      limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
      limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;
      limit_req_status 429;

      # Gzip
      gzip on;
      gzip_comp_level 6;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

      # Headers
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;

      include /etc/nginx/conf.d/*.conf;
    }

  default.conf: |
    upstream backend {
      server backend:8000;
    }

    upstream frontend {
      server frontend:3000;
    }

    # WAF: Block malicious query patterns
    map $query_string $is_malicious_query {
      default 0;
      "~*(union.*select|select.*from|insert.*into|drop.*table|delete.*from|update.*set)" 1;
      "~*(<script|alert\(|onerror=|onload=)" 1;
      "~*(\.\./\.\./|\.\.%2f\.\.%2f|%00)" 1;
      "~*(exec|system|passthru|shell_exec|eval\()" 1;
      "~*(adminer|phpmyadmin|wp-admin|wp-login)" 1;
    }

    # WAF: Block malicious User-Agents
    map $http_user_agent $is_bad_agent {
      default 0;
      "~*(nikto|sqlmap|nessus|openvas|acunetix|burp|nmap|masscan|hydra|medusa)" 1;
      "~*(zgrab|curl|wget|python-requests|go-http-client|Java)" 1;
    }

    # Redirect HTTP to HTTPS
    server {
      listen 80 default_server;
      server_name _;
      return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
      listen 443 ssl http2 default_server;
      server_name analytics.example.com;

      ssl_certificate /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      ssl_stapling on;
      ssl_stapling_verify on;
      ssl_trusted_certificate /etc/nginx/ssl/tls.crt;

      # HSTS
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://analytics.example.com; frame-ancestors 'none'; form-action 'self'" always;

      # Access logs
      access_log /var/log/nginx/access.log;
      error_log /var/log/nginx/error.log warn;

      # WAF block
      if ($is_malicious_query) { return 444; }
      if ($is_bad_agent) { return 444; }

      # Health check (no rate limit, no auth)
      location /health {
        access_log off;
        limit_req zone=general_limit burst=10 nodelay;
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      # API
      location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 10m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
      }

      # Auth rate-limited endpoints
      location ~ ^/api/auth/(login|register|reset-password|forgot-password) {
        limit_req zone=login_limit burst=5 nodelay;
        client_max_body_size 1m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # GraphQL
      location /graphql {
        limit_req zone=graphql_limit burst=10 nodelay;
        client_max_body_size 1m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # WebSocket
      location /ws {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
      }

      # Frontend
      location / {
        limit_req zone=general_limit burst=30 nodelay;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Block sensitive files
        location ~* \.(env|git|gitignore|dockerignore|Dockerfile|docker-compose|yml|yaml|md|log|sql|db)$ {
          deny all;
          return 404;
        }

        location ~* /\.(git|svn|hg|idea|vscode) {
          deny all;
          return 404;
        }
      }
    }
