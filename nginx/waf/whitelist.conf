# =============================================================================
# WAF Whitelist Configuration
# =============================================================================
# Configure IPs, paths, and patterns that should bypass WAF rules.
# This file should be reviewed and updated regularly.
# =============================================================================

# ── Health Check Endpoints ─────────────────────────────────────────────────
# Skip WAF inspection for health checks
map $uri $skip_waf {
    default 0;
    /health 1;
    /ready 1;
    /live 1;
}

