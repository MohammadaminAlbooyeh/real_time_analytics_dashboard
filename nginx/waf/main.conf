# =============================================================================
# Web Application Firewall - Main Configuration
# =============================================================================
# This configuration complements the Nginx WAF rules already defined in
# conf.d/default.conf. It provides enhanced ModSecurity-compatible rule sets
# for Nginx using native Nginx map/if directives.
#
# Include from nginx.conf:
#   include /etc/nginx/waf/main.conf;
# =============================================================================

# ── SQL Injection Protection ─────────────────────────────────────────────────
map $query_string $waf_sqli {
  default 0;
  "~*(union(\s+all)?\s+select)" 1;
  "~*select\s+.*\s+from\s+.*information_schema" 1;
  "~*union\s+.*select\s+.*into\s+(outfile|dumpfile)" 1;
  "~*(exec\s*\(|\s*declare\s*@|sp_executesql|xp_cmdshell)" 1;
  "~*(sys\.|dbms_|utl_http|utl_file|utl_smtp)" 1;
  "~*(pg_sleep|waitfor\s+delay|benchmark\s*\()" 1;
  "~*(\'|\")\s*(or|and)\s+(\'|\")?(\d+|\w+)\s*(=|like|in)\s*(\'|\")" 1;
  "~*(into\s+(outfile|dumpfile)\s+.*\.\w+)" 1;
  "~*(0x[0-9a-f]{4,}|char\s*\([0-9,]+\)|concat\s*\()" 1;
  "~*(convert|cast)\s*\(\s*\(?\s*select\s+" 1;
}

# ── XSS Protection ──────────────────────────────────────────────────────────
map $query_string $waf_xss {
  default 0;
  "~*(<script[^>]*>|<\/script>|<iframe[^>]*>|<\/iframe>)" 1;
  "~*(<img[^>]*onerror|<svg[^>]*onload|<body[^>]*onload)" 1;
  "~*(alert\s*\(|confirm\s*\(|prompt\s*\()" 1;
  "~*(javascript:|data:text\/html|vbscript:|expression\s*\()" 1;
  "~*(onerror=|onload=|onclick=|onmouseover=|onfocus=|onblur=)" 1;
  "~*(<embed[^>]*>|<object[^>]*>|<applet[^>]*>|<meta[^>]*http-equiv)" 1;
  "~*(document\.cookie|document\.location|window\.location)" 1;
  "~*(fromCharCode|eval\s*\(|setTimeout\s*\(|setInterval\s*\()" 1;
}

# ── Path Traversal Protection ───────────────────────────────────────────────
map $uri $waf_traversal {
  default 0;
  "~*(\.\./\.\./|\.\.%2f\.\.%2f|\.\.\\\.\.\\)" 1;
  "~*(/etc/passwd|/etc/shadow|/etc/hosts|/proc/self/environ)" 1;
  "~*(/\.git/config|/\.env|/web\.config|/\.htaccess)" 1;
  "~*(/windows/system32|/boot\.ini|/autoexec\.bat)" 1;
  "~*(%00|null|\.\.%00|%2e%2e%2f)" 1;
}

# ── Command Injection Protection ────────────────────────────────────────────
map $query_string $waf_cmdi {
  default 0;
  "~*(;\s*(sh|bash|cmd|powershell|python|perl|ruby)" 1;
  "~*(\||`)\s*(id|whoami|uname|cat|ls|chmod|chown|rm|kill|wget|curl)" 1;
  "~*(\$\(|`[^`]+`)" 1;
  "~*(-e\s+.*(sh|bash|cmd)|--exec|--execute)" 1;
}

# ── File Inclusion Protection ───────────────────────────────────────────────
map $query_string $waf_lfi {
  default 0;
  "~*(include\s*=|require\s*=|include_once\s*=|require_once\s*=)" 1;
  "~*(php://|file://|expect://|zip://|phar://|compress.zlib://)" 1;
  "~*(data://text/plain|data://text/html|data:text/plain)" 1;
}

# ── Combined WAF Check ─────────────────────────────────────────────────────
map "${waf_sqli}${waf_xss}${waf_traversal}${waf_cmdi}${af_lfi}" $waf_block {
  default 0;
  "~1" 1;
}

# ── Rate Limiting by Endpoint Type ─────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=waf_high_risk:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=waf_medium_risk:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=waf_low_risk:10m rate=100r/m;

# ── IP Blacklist (extend with known malicious IPs) ─────────────────────────
# Uncomment and add IPs to block:
# geo $waf_blocked_ip {
#   default 0;
#   10.0.0.0/8 1;
#   172.16.0.0/12 1;
# }

# ── Request Body Inspection (for POST requests) ────────────────────────────
# Note: Nginx cannot easily inspect request bodies with map directives.
# For production, consider using:
#   - nginx-module-modsecurity with OWASP CRS
#   - Lua-based WAF (lua-nginx-module)
#   - Sidecar WAF proxy (e.g., Coraza, NAXSI)
