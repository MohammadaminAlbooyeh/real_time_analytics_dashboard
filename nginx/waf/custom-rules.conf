# =============================================================================
# Custom WAF Rules
# =============================================================================
# Application-specific security rules for the Analytics Dashboard.
# These rules are tailored to protect the specific endpoints and patterns
# used by this application.
# =============================================================================

# ── Block access to sensitive paths (even if proxy passes through) ─────────
location ~* /(alembic|migrations|tests|__pycache__|\.pytest_cache|\.venv|node_modules) {
    deny all;
    return 404;
}

location ~* /(adminer|phpmyadmin|pma|phpPgAdmin|pgadmin) {
    deny all;
    return 403;
}

location ~* /(actuator|swagger|api-docs|api/v1/api-docs) {
    deny all;
    return 403;
}

# ── Enforce JSON content type for API POST/PUT ─────────────────────────────
location ~* ^/api/v1/.*$ {
    limit_except GET OPTIONS HEAD {
        if ($http_content_type !~* "application/json") {
            return 415;
        }
    }
}

# ── Enforce request size limits by endpoint type ──────────────────────────
location /api/v1/datasources {
    client_max_body_size 5m;
}

location /api/v1/reports/export {
    client_max_body_size 2m;
}

location /api/auth/register {
    client_max_body_size 1m;
}

# ── Block requests with suspicious headers ─────────────────────────────────
# Block requests with X-Forwarded-For header injection attempts
if ($http_x_forwarded_for ~* "(\r|\n|%0d|%0a)") {
    return 444;
}

# Block requests with malicious Host headers
if ($host !~* "^(analytics\.example\.com|localhost|(\d{1,3}\.){3}\d{1,3}(:\d+)?)$") {
    return 444;
}

# Block requests without a User-Agent header
if ($http_user_agent = "") {
    return 444;
}

# ── CORS Policy Enforcement ────────────────────────────────────────────────
# Allowed origins for CORS
map $http_origin $cors_origin {
    default "";
    "~^https://analytics\.example\.com$" $http_origin;
    "~^http://localhost:3000$" $http_origin;
    "~^http://localhost:8000$" $http_origin;
}

# ── Brute Force Protection ─────────────────────────────────────────────────
# Track login attempts per IP (requires ngx_http_limit_req_module)
# The login_limit zone is already configured in conf.d/default.conf

# ── Bot Detection ──────────────────────────────────────────────────────────
map $http_user_agent $is_bot {
    default 0;
    "~*(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot)" 2;
    "~*(AhrefsBot|SemrushBot|Moz|Majestic|Screaming Frog|HTTrack)" 1;
    "~*(PetalBot|MJ12bot|BLEXBot|DotBot|SeekportBot|Expanse)" 1;
}

# Allow legitimate search engine bots, rate-limit aggressive crawlers
