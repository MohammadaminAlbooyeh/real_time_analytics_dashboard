upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Map to block common malicious patterns in query strings
map $query_string $is_malicious_query {
    default 0;
    "~*(?:(union.*select|select.*from|insert.*into|update.*set|delete.*from|drop\s+table|alter\s+table|create\s+table|exec\s*\(|execute\s*\(|xp_cmdshell|sp_executesql|load_file|into\s+outfile|into\s+dumpfile|--|#.*--|\bOR\b.*=.*--|\bAND\b.*=.*--))" 1;
    "~*(\b(?:../)+|\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self|/proc/1/environ|/sys/|/windows/|boot\.ini|win\.ini)" 1;
    "~*(<script|javascript:|onerror=|onload=|onclick=|onmouseover=|alert\(|prompt\(|confirm\(|document\.cookie|document\.location|window\.location|eval\(|fromCharCode)" 1;
    "~*(?:cmd=|exec=|command=|exec_command=|powershell|wget\s+|curl\s+|bash\s+|/bin/sh|/bin/bash)" 1;
}

# Malicious User-Agent patterns
map $http_user_agent $is_bad_agent {
    default 0;
    "~*(nikto|sqlmap|wpscan|acunetix|nessus|openvas|burpsuite|masscan|zmeu|zgrab|jcrwl|curl\s*7\.\d+|python-requests|go-http-client|java/|ruby|perl|scanner|crawler|malicious|nmap|hydra|medusa|aircrack)" 1;
}

# HTTP server (redirects to HTTPS with HSTS)
server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP to HTTPS (production)
    location / {
        return 301 https://$host$request_uri;
    }

    # Health check can still be HTTP (for load balancers)
    location /health {
        proxy_pass http://backend;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server (TLS)
server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!DSS:!RC4:!3DES:!ADH:!EXP;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS - uncomment with your domain in production
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), fullscreen=(self)" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Deny malicious query strings
    if ($is_malicious_query) {
        return 444;
    }

    # Deny malicious user agents
    if ($is_bad_agent) {
        return 444;
    }

    # API endpoints with WAF rules
    location /api/ {
        # Rate limiting: 100 req/min per IP, burst 20
        limit_req zone=api_limit burst=20 nodelay;

        # Limit request body size to 10MB
        client_max_body_size 10M;

        # Block SQL injection in URI
        if ($args ~* "(union.*select|select.*from|insert.*into|update.*set|delete.*from|drop\s+table|alter\s+table|create\s+table|exec\s*\()") {
            return 403;
        }

        # Block path traversal
        if ($uri ~* "(\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self)") {
            return 403;
        }

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Hide upstream headers that leak info
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header X-AspNet-Version;

        # Buffer settings for security
        proxy_buffer_size 4k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;
    }

    # Login/sensitive endpoints - stricter rate limiting
    location ~* ^/api/(auth/login|auth/register|auth/reset-password|auth/forgot-password|admin/) {
        # Stricter rate limiting: 10 req/min per IP
        limit_req zone=login_limit burst=5 nodelay;

        # Limit body size
        client_max_body_size 1M;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL endpoint
    location /graphql {
        # Stricter rate limiting for GraphQL
        limit_req zone=graphql_limit burst=10 nodelay;

        # Limit request body size to 1MB (GraphQL queries can be large)
        client_max_body_size 1M;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # WebSocket endpoint
    location /ws {
        limit_req zone=general_limit burst=20;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Health check endpoint
    location /health {
        access_log off;
        limit_req zone=general_limit burst=20;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Deny access to sensitive files
    location ~* (\.env|\.git|\.svn|\.hg|composer\.json|package-lock\.json|yarn\.lock|nginx\.conf|Dockerfile|docker-compose\.yml) {
        deny all;
        return 404;
    }
}
